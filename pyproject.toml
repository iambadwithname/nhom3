[project]
name = "nhom3"
version = "0.1.0"
description = "Chest X-ray classification (COVID-19 / Normal / Pneumonia) with CNNs"
readme = "README.md"
authors = [
    { name = "Phan Thị Anh Quỳnh" },
    { name = "Lê Duy Quyền" },
    { name = "Chử Vũ Thảo Hiền" },
    { name = "Nguyễn Minh Quang" },
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
