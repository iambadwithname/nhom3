[project]
name = "nhom3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mq", email = "minhquang2006m@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "basedpyright>=1.40.0",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "marimo[lsp,recommended,sandbox,sql]>=0.24.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "pyrefly>=1.2.0",
    "python-lsp-server>=1.15.0",
    "ruff>=0.16.6",
    "scikit-learn>=1.9.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ty>=0.0.80",
]

[project.scripts]
nhom3 = "nhom3:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
